<!doctype html>
<html lang="es">
<head>
    <!-- Plantilla comun: todas las paginas heredan esta estructura. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Abastecimiento B2B{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink: #1b2924; --pine: #174b3f; --leaf: #3c775e; --lime: #d8e8a0; --paper: #f7f8f3; --line: #dfe5dd; --muted: #68756e; --coral: #c85e45; }
        body { background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; font-family: 'DM Sans', sans-serif; }
        h1, h2, h3, .display-serif { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; }
        a { color: var(--pine); }
        .announcement { background: var(--pine); color: #f5f8ef; font-size: .75rem; }
        .announcement-inner { min-height: 34px; display: flex; align-items: center; justify-content: center; gap: .45rem; }
        .announcement strong { color: var(--lime); font-weight: 600; }
        .site-nav { background: #fff; border-bottom: 1px solid var(--line); }
        .nav-shell { min-height: 78px; }
        .brand-lockup { display: inline-flex; align-items: center; gap: .65rem; color: var(--pine); text-decoration: none; }
        .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; background: var(--lime); color: var(--pine); font-size: 1.35rem; font-weight: 700; }
        .brand-name { display: block; font-size: .9rem; line-height: 1.05; font-weight: 700; }
        .brand-caption { display: block; margin-top: .2rem; color: var(--muted); font-size: .59rem; letter-spacing: .08em; }
        .site-nav .nav-link { color: #42534b; font-size: .87rem; padding: .6rem .8rem; }
        .site-nav .nav-link:hover, .site-nav .nav-link.active { color: var(--pine); }
        .nav-utility { display: flex; align-items: center; gap: .35rem; }
        .nav-utility .btn { border-radius: 2px; font-size: .82rem; }
        .nav-toggle { border: 1px solid var(--line); background: #fff; color: var(--pine); padding: .4rem .65rem; }
        .hero { background: var(--pine); color: white; }
        .site-footer { background: #fff; border-top: 1px solid var(--line); }
        .site-footer .container { color: var(--muted); }
        .form-control, .form-select { border-color: var(--line); border-radius: 2px; min-height: 44px; }
        .form-control:focus, .form-select:focus { border-color: var(--leaf); box-shadow: 0 0 0 .18rem rgba(60, 119, 94, .14); }
        .btn-success { background: var(--pine); border-color: var(--pine); border-radius: 2px; }
        .btn-success:hover, .btn-success:focus { background: #10392f; border-color: #10392f; }
        .table thead th { white-space: nowrap; }
        @media (max-width: 991.98px) {
            .nav-shell { min-height: 68px; }
            .nav-utility { align-items: flex-start; flex-direction: column; padding: .4rem 0 .8rem; }
            .site-nav .nav-link { padding-left: 0; }
        }
    </style>
</head>
<body>
    <div class="announcement">
        <div class="container announcement-inner"><strong>ABASTECIMIENTO INSTITUCIONAL</strong><span>Catálogo de salud con trazabilidad por lote</span></div>
    </div>
    <nav class="site-nav navbar navbar-expand-lg">
        <div class="container nav-shell">
            <a class="brand-lockup" href="/" aria-label="Botica Institucional, inicio">
                <span class="brand-mark" aria-hidden="true">+</span>
                <span><span class="brand-name">BOTICA</span><span class="brand-caption">INSTITUCIONAL</span></span>
            </a>
            <button class="navbar-toggler nav-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#site-menu" aria-controls="site-menu" aria-expanded="false" aria-label="Abrir menú">Menú</button>
            <div class="collapse navbar-collapse" id="site-menu">
                <div class="navbar-nav mx-auto">
                    <a class="nav-link" href="/">Inicio</a>
                    <a class="nav-link" href="/products/">Catálogo</a>
                    <a class="nav-link" href="/cart/">Solicitud <span class="badge text-bg-success" id="cart-count">0</span></a>
                </div>
                <div class="nav-utility">
                    <a class="btn btn-outline-success d-none" href="/gestor/" id="warehouse-link">Panel de administración</a>
                    <a class="btn btn-outline-success" href="/login/" id="login-link">Ingresar</a>
                    <a class="btn btn-success" href="/register/" id="register-link">Crear cuenta</a>
                    <span class="small text-success d-none" id="session-status">Sesión activa</span>
                    <button class="btn btn-outline-secondary d-none" id="logout-button" type="button">Salir</button>
                </div>
            </div>
        </div>
    </nav>
    <main class="flex-grow-1">{% block content %}{% endblock %}</main>
    <footer class="site-footer py-3">
        <div class="container small text-secondary">{{ STUDENT_NAME }} | Sección: {{ STUDENT_SECTION }} | {% now "Y" %}</div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function refreshCartCount() {
        const cart = JSON.parse(localStorage.getItem('nexo-cart') || '[]');
        const items = Array.isArray(cart) ? cart : (cart.items || []);
        const count = items.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
        const cartCount = document.querySelector('#cart-count');
        if (cartCount) cartCount.textContent = count;
    }

    refreshCartCount();
    window.addEventListener('storage', event => {
        if (event.key === 'nexo-cart') refreshCartCount();
    });

    const accessToken = localStorage.getItem('nexo-access-token');
    const loginLink = document.querySelector('#login-link');
    const registerLink = document.querySelector('#register-link');
    const warehouseLink = document.querySelector('#warehouse-link');
    const sessionStatus = document.querySelector('#session-status');
    const logoutButton = document.querySelector('#logout-button');
    function tokenRole(token) {
        try {
            const payload = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(atob(payload)).role;
        } catch (error) {
            return null;
        }
    }

    async function loadUserCart() {
        if (!accessToken) return;
        try {
            const response = await fetch('/api/carro-insumos/', {
                headers: { Authorization: `Bearer ${accessToken}` }
            });
            if (!response.ok) return;
            const payload = await response.json();
            localStorage.setItem('nexo-cart', JSON.stringify(payload.items || []));
            refreshCartCount();
        } catch (error) {
            console.warn('No se pudo restaurar el carrito del usuario:', error);
        }
    }

    if (accessToken) {
        loginLink.classList.add('d-none');
        registerLink.classList.add('d-none');
        if (tokenRole(accessToken) === 'gestor_bodega') warehouseLink.classList.remove('d-none');
        sessionStatus.classList.remove('d-none');
        logoutButton.classList.remove('d-none');
        loadUserCart();
    }
    logoutButton.addEventListener('click', () => {
        localStorage.removeItem('nexo-access-token');
        localStorage.removeItem('nexo-refresh-token');
        localStorage.removeItem('nexo-cart');
        window.location.href = '/';
    });
    </script>
</body>
</html>
